<article class="product-card">
  <div class="product-image">
    @if (product.imageUrl) {
    <img [src]="product.imageUrl" [alt]="product.name">
    } @else {
    <span>💊</span>
    }
  </div>

  <div class="product-content">
    <p class="product-category">{{ product.therapeuticGroup || 'Sản phẩm y tế' }}</p>

    <h3 class="product-name">{{ product.name }}</h3>

    <p class="product-ingredient">{{ product.activeIngredient || 'Không áp dụng' }}</p>

    <div class="product-bottom">
      <p class="product-price">{{ product.price | number }}đ</p>
      <a class="view-button" [routerLink]="['/products', product.id]">Xem</a>
    </div>
  </div>
</article>
